<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SneakFlip</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;font-family:'Inter',sans-serif;color:#111}
.hdr{background:#111;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Oswald',sans-serif;font-size:26px;color:#fff;letter-spacing:3px}
.logo b{color:#E5202E}
.tgl{font-size:9px;color:#888;letter-spacing:2px;text-transform:uppercase}
.lbar{background:#f5f5f5;display:flex;justify-content:flex-end;padding:8px 20px;gap:4px;border-bottom:1px solid #eee}
.lb{background:none;border:none;border-bottom:2px solid transparent;font-family:'Oswald',sans-serif;font-size:12px;color:#888;cursor:pointer;padding:4px 8px;letter-spacing:1px}
.lb.on{color:#E5202E;border-bottom:2px solid #E5202E}
.tabs{display:flex;border-bottom:2px solid #f0f0f0}
.tab{flex:1;padding:14px;background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;color:#888;font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:2px;cursor:pointer}
.tab.on{color:#111;border-bottom:3px solid #E5202E}
.bdy{padding:20px;max-width:600px;margin:0 auto}
.lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#888;margin-bottom:6px;display:block}
.inp{width:100%;background:#f5f5f5;border:2px solid transparent;color:#111;font-size:14px;padding:11px 14px;outline:none;margin-bottom:14px;font-family:'Inter',sans-serif}
.inp:focus{border:2px solid #111;background:#fff}
.inp::placeholder{color:#ccc}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#f5f5f5;border-left:4px solid #ddd;padding:14px 16px;margin-bottom:8px;display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:14px}
.card.g{border-left:4px solid #E5202E}
.pn{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:2px;color:#111}
.pr{text-align:right}
.pv{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700}
.red{color:#E5202E}.gry{color:#bbb}
.ps{font-size:9px;color:#888;margin-top:2px}
.sec{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:3px;color:#888;margin:12px 0 14px;padding-bottom:8px;border-bottom:1px solid #f0f0f0}
.ptb{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.pt{padding:7px 14px;background:#f5f5f5;border:2px solid transparent;color:#888;font-family:'Oswald',sans-serif;font-size:11px;cursor:pointer;letter-spacing:1px}
.pt.on{background:#111;color:#fff}
.btn{width:100%;background:#E5202E;color:#fff;border:none;font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:3px;padding:15px;cursor:pointer;margin-bottom:14px}
.btn:disabled{background:#f0f0f0;color:#bbb;cursor:not-allowed}
.out{background:#f5f5f5;border-left:4px solid #E5202E;padding:14px 16px;font-size:12px;line-height:1.8;color:#333;white-space:pre-wrap;word-break:break-word;margin-bottom:10px;min-height:80px}
.cp{width:100%;background:#111;border:none;color:#fff;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:3px;padding:12px;cursor:pointer}
.nt{font-size:9px;color:#ccc;letter-spacing:1px;margin-top:-8px;margin-bottom:14px}
.emp{color:#ccc;font-size:11px;text-align:center;padding:20px 0}
textarea.inp{resize:vertical;min-height:60px}
select.inp{appearance:none;cursor:pointer}
.ci{background:#f5f5f5;border-left:4px solid #ddd;padding:14px 16px;margin-bottom:8px}
.ci.ok{border-left:4px solid #22c55e}
.ci.bad{border-left:4px solid #E5202E}
.ct{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:1px;margin-bottom:4px}
.cd{font-size:11px;color:#666;line-height:1.6}
.cbtn{display:flex;gap:8px;margin-top:10px}
.cbtn button{flex:1;padding:8px;border:none;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:1px;cursor:pointer}
.cs{font-family:'Oswald',sans-serif;font-size:11px;font-weight:700;margin-top:6px}
.cs.ok{color:#22c55e}.cs.bad{color:#E5202E}
.vrd{padding:14px 16px;margin-bottom:14px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:2px;text-align:center;font-weight:700}
.vrd.ok{background:#f0fdf4;color:#16a34a;border-left:4px solid #22c55e}
.vrd.bad{background:#fff5f5;color:#E5202E;border-left:4px solid #E5202E}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const {useState}=React;
const e=React.createElement;

const L={
  it:{t1:"Margine",t2:"Annuncio",t3:"Verifica",tg:"Reseller Toolkit",
    s1:"Prezzi",s2:"Profitto per piattaforma",s3:"Prodotto",s4:"Piattaforma",s5:"Output",s6:"Verifica Autenticita Nike",
    l1:"Acquisto",l2:"Vendita",l3:"Modello Nike",l4:"Taglia EU",l5:"Prezzo",l6:"Condizioni",l7:"Note extra",
    b1:"Genera annuncio",b2:"Copia testo",b3:"Copiato!",
    n1:"Commissioni incluse",n2:"Seleziona cosa hai verificato",n3:"Annuncio qui",
    v1:"Probabile originale",v2:"Potrebbero essere fake",
    conds:["Nuovo","Come nuovo","Ottime condizioni","Buone condizioni"],
    ok:"OK",bad:"Sospetto",
    checks:[
      {id:"sw",t:"Swoosh",d:"Logo preciso, non storto. Estremita sottili e regolari."},
      {id:"st",t:"Cuciture",d:"Cuciture uniformi, senza fili liberi o punti irregolari."},
      {id:"lb",t:"Etichetta",d:"Numero di stile, taglia, paese. Font uniforme, senza sbavature."},
      {id:"bx",t:"Scatola",d:"Font consistente, codice a barre leggibile, taglia corretta."},
      {id:"sl",t:"Suola",d:"Materiale solido, testo inciso nitido."},
      {id:"sm",t:"Odore",d:"Odore di gomma normale. Odore chimico forte e sospetto."},
    ]},
  en:{t1:"Margin",t2:"Listing",t3:"Verify",tg:"Reseller Toolkit",
    s1:"Prices",s2:"Profit per platform",s3:"Product",s4:"Platform",s5:"Output",s6:"Nike Authenticity Check",
    l1:"Buy price",l2:"Sell price",l3:"Nike Model",l4:"EU Size",l5:"Price",l6:"Condition",l7:"Extra notes",
    b1:"Generate listing",b2:"Copy text",b3:"Copied!",
    n1:"Fees included",n2:"Select what you verified",n3:"Listing here",
    v1:"Likely authentic",v2:"Might be fake",
    conds:["New","Like new","Great condition","Good condition"],
    ok:"OK",bad:"Suspicious",
    checks:[
      {id:"sw",t:"Swoosh",d:"Logo must be precise, not crooked. Ends thin and regular."},
      {id:"st",t:"Stitching",d:"Uniform stitching, no loose threads."},
      {id:"lb",t:"Inner label",d:"Style number, size, country. Uniform font, no smudges."},
      {id:"bx",t:"Box",d:"Consistent font, readable barcode, correct size."},
      {id:"sl",t:"Sole",d:"Solid material, sharp engraved text."},
      {id:"sm",t:"Smell",d:"Normal rubber smell. Strong chemical smell is suspicious."},
    ]},
  fr:{t1:"Marge",t2:"Annonce",t3:"Verifier",tg:"Outil Revendeur",
    s1:"Prix",s2:"Profit par plateforme",s3:"Produit",s4:"Plateforme",s5:"Resultat",s6:"Verification Authenticite Nike",
    l1:"Prix achat",l2:"Prix vente",l3:"Modele Nike",l4:"Pointure EU",l5:"Prix",l6:"Etat",l7:"Notes",
    b1:"Generer annonce",b2:"Copier",b3:"Copie!",
    n1:"Commissions incluses",n2:"Selectionnez ce que vous avez verifie",n3:"Annonce ici",
    v1:"Probablement authentique",v2:"Pourrait etre faux",
    conds:["Neuf","Comme neuf","Tres bon etat","Bon etat"],
    ok:"OK",bad:"Suspect",
    checks:[
      {id:"sw",t:"Swoosh",d:"Logo precis, pas de travers. Extremites fines et regulieres."},
      {id:"st",t:"Coutures",d:"Coutures uniformes, sans fils libres."},
      {id:"lb",t:"Etiquette",d:"Numero de style, pointure, pays. Police uniforme."},
      {id:"bx",t:"Boite",d:"Police coherente, code-barres lisible, bonne pointure."},
      {id:"sl",t:"Semelle",d:"Materiau solide, texte grave net."},
      {id:"sm",t:"Odeur",d:"Odeur caoutchouc normale. Odeur chimique forte = suspect."},
    ]},
};

const PL=[
  {id:"vinted",name:"Vinted",c:0.05,f:0.7,col:"#09B1BA"},
  {id:"ebay",name:"eBay",c:0.13,f:0.3,col:"#E53238"},
  {id:"subito",name:"Subito.it",c:0.08,f:0,col:"#FF6B00"},
];

function App(){
  const [lang,setLang]=useState("it");
  const [tab,setTab]=useState("c");
  const [buy,setBuy]=useState("");
  const [sell,setSell]=useState("");
  const [model,setModel]=useState("");
  const [size,setSize]=useState("");
  const [ci,setCi]=useState(0);
  const [price,setPrice]=useState("");
  const [extra,setExtra]=useState("");
  const [plat,setPlat]=useState("vinted");
  const [gen,setGen]=useState("");
  const [cop,setCop]=useState(false);
  const [chk,setChk]=useState({});
  const t=L[lang];
  const b=parseFloat(buy)||0;
  const s=parseFloat(sell)||0;

  function margin(p){
    const fees=s*p.c+p.f;
    const profit=s-b-fees;
    return {profit:profit.toFixed(2),pct:((profit/b)*100).toFixed(1),fees:fees.toFixed(2)};
  }

  function mkListing(){
    const c=t.conds[ci];
    const m=model,sz=size,pr=price,ex=extra;
    const txt={
      vinted:`Nike ${m} - Taglia ${sz}\n\nCondizione: ${c}\nPrezzo: EUR${pr}\n\n${ex?ex+"\n\n":""}Acquistati outlet Nike Italia. Originali 100%.\n\nSpedizione rapida con tracking.\n\n#nike #sneakers #outlet`,
      ebay:`Nike ${m} - EU ${sz} - ${c}\n\nModello: ${m}\nTaglia: ${sz}\nCondizione: ${c}\n${ex?"Note: "+ex+"\n":""}\nSpedizione con tracking. Reso 30 giorni.\nOriginali outlet Nike Italia.`,
      subito:`Nike ${m} taglia ${sz} EUR${pr}\n\nCondizioni: ${c}\n${ex?ex+"\n":""}\nOriginali Nike Italia. Spedisco ovunque.`,
    };
    setGen(txt[plat]);setCop(false);
  }

  function copy(){navigator.clipboard.writeText(gen);setCop(true);setTimeout(()=>setCop(false),2000);}
  function tog(id,v){setChk(prev=>({...prev,[id]:v}));}

  const ks=Object.keys(chk).filter(k=>chk[k]!==undefined);
  const anyBad=ks.some(k=>chk[k]===false);

  return e("div",null,
    e("div",{className:"hdr"},
      e("div",null,
        e("div",{className:"logo"},"SNEAK",e("b",null,"FLIP")),
        e("div",{className:"tgl"},t.tg)
      )
    ),
    e("div",{className:"lbar"},
      ["it","en","fr"].map(l=>e("button",{key:l,className:"lb "+(lang===l?"on":""),onClick:()=>{setLang(l);setGen("");setCi(0);setChk({});}},l.toUpperCase()))
    ),
    e("div",{className:"tabs"},
      e("button",{className:"tab "+(tab==="c"?"on":""),onClick:()=>setTab("c")},t.t1),
      e("button",{className:"tab "+(tab==="l"?"on":""),onClick:()=>setTab("l")},t.t2),
      e("button",{className:"tab "+(tab==="v"?"on":""),onClick:()=>setTab("v")},t.t3)
    ),
    e("div",{className:"bdy"},
      tab==="c"?e("div",null,
        e("div",{className:"sec"},t.s1),
        e("div",{className:"row"},
          e("div",null,e("label",{className:"lbl"},t.l1+" (EUR)"),e("input",{className:"inp",type:"number",placeholder:"65",value:buy,onChange:ev=>setBuy(ev.target.value)})),
          e("div",null,e("label",{className:"lbl"},t.l2+" (EUR)"),e("input",{className:"inp",type:"number",placeholder:"120",value:sell,onChange:ev=>setSell(ev.target.value)}))
        ),
        e("div",{className:"nt"},"* "+t.n1),
        e("div",{className:"sec"},t.s2),
        PL.map(p=>{
          const {profit,pct,fees}=margin(p);
          const n=parseFloat(profit);
          const has=b>0&&s>0;
          return e("div",{className:"card "+(has&&n>0?"g":""),key:p.id},
            e("div",{style:{width:10,height:10,borderRadius:"50%",background:p.col}}),
            e("div",null,
              e("div",{className:"pn"},p.name),
              has&&e("div",{className:"nt",style:{margin:"4px 0 0"}},fees+" EUR fees")
            ),
            e("div",{className:"pr"},
              has?e("div",null,
                e("div",{className:"pv "+(n>0?"red":"gry")},(n>0?"+":"")+profit+" EUR"),
                e("div",{className:"ps"},pct+"%")
              ):e("div",{className:"ps"},"—")
            )
          );
        })
      ):tab==="l"?e("div",null,
        e("div",{className:"sec"},t.s3),
        e("label",{className:"lbl"},t.l3),
        e("input",{className:"inp",placeholder:"Air Max 90",value:model,onChange:ev=>setModel(ev.target.value)}),
        e("div",{className:"row"},
          e("div",null,e("label",{className:"lbl"},t.l4),e("input",{className:"inp",placeholder:"42",value:size,onChange:ev=>setSize(ev.target.value)})),
          e("div",null,e("label",{className:"lbl"},t.l5+" (EUR)"),e("input",{className:"inp",placeholder:"110",value:price,onChange:ev=>setPrice(ev.target.value)}))
        ),
        e("label",{className:"lbl"},t.l6),
        e("select",{className:"inp",value:ci,onChange:ev=>setCi(parseInt(ev.target.value))},
          t.conds.map((c,i)=>e("option",{key:i,value:i},c))
        ),
        e("label",{className:"lbl"},t.l7),
        e("textarea",{className:"inp",placeholder:"...",value:extra,onChange:ev=>setExtra(ev.target.value)}),
        e("div",{className:"sec"},t.s4),
        e("div",{className:"ptb"},PL.map(p=>e("button",{key:p.id,className:"pt "+(plat===p.id?"on":""),onClick:()=>{setPlat(p.id);setGen("");}},p.name))),
        e("button",{className:"btn",onClick:mkListing,disabled:!model||!size||!price},t.b1),
        e("div",{className:"sec"},t.s5),
        e("div",{className:"out"},gen||e("div",{className:"emp"},t.n3)),
        gen&&e("button",{className:"cp",onClick:copy},cop?t.b3:t.b2)
      ):e("div",null,
        e("div",{className:"sec"},t.s6),
        e("div",{className:"nt",style:{marginBottom:14}},t.n2),
        ks.length>0&&e("div",{className:"vrd "+(anyBad?"bad":"ok")},anyBad?t.v2:t.v1),
        t.checks.map(c=>e("div",{key:c.id,className:"ci "+(chk[c.id]===true?"ok":chk[c.id]===false?"bad":"")},
          e("div",{className:"ct"},c.t),
          e("div",{className:"cd"},c.d),
          e("div",{className:"cbtn"},
            e("button",{style:{background:chk[c.id]===true?"#22c55e":"#e5e5e5",color:chk[c.id]===true?"#fff":"#888"},onClick:()=>tog(c.id,true)},"✓ "+t.ok),
            e("button",{style:{background:chk[c.id]===false?"#E5202E":"#e5e5e5",color:chk[c.id]===false?"#fff":"#888"},onClick:()=>tog(c.id,false)},"✗ "+t.bad)
          ),
          chk[c.id]!==undefined&&e("div",{className:"cs "+(chk[c.id]?"ok":"bad")},chk[c.id]?t.ok+" ✓":t.bad+" ⚠")
        ))
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
