<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SneakFlip</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0a0a0a;font-family:'DM Mono',monospace;color:#f0f0f0}
    #root{min-height:100vh}
    .header{border-bottom:1px solid #1f1f1f;padding:20px 24px 16px;display:flex;align-items:flex-end;gap:12px}
    .logo{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;color:#fff;line-height:1}
    .logo span{color:#39FF14}
    .tagline{font-size:10px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
    .tabs{display:flex;border-bottom:1px solid #1f1f1f}
    .tab{flex:1;padding:14px;background:none;border:none;color:#555;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent}
    .tab.active{color:#39FF14;border-bottom:2px solid #39FF14}
    .body{padding:24px;max-width:600px;margin:0 auto}
    .label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:6px;display:block}
    .inp{width:100%;background:#111;border:1px solid #222;color:#f0f0f0;font-family:'DM Mono',monospace;font-size:14px;padding:10px 14px;border-radius:4px;outline:none;margin-bottom:16px}
    .inp:focus{border-color:#39FF14}
    .inp::placeholder{color:#333}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .card{background:#111;border:1px solid #1f1f1f;border-radius:6px;padding:16px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px}
    .dot{width:8px;height:8px;border-radius:50%}
    .pname{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#888}
    .profit{text-align:right}
    .pnum{font-size:20px;font-family:'Bebas Neue',sans-serif;letter-spacing:1px}
    .pos{color:#39FF14}.neg{color:#FF4545}.zero{color:#555}
    .psub{font-size:9px;color:#444;letter-spacing:1px}
    .sec{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#333;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid #1a1a1a;margin-top:8px}
    .ptabs{display:flex;gap:8px;margin-bottom:16px}
    .ptab{padding:7px 14px;border-radius:3px;background:#111;border:1px solid #222;color:#555;font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;letter-spacing:1px}
    .ptab.active{background:#39FF14;color:#000;border-color:#39FF14}
    .btn{width:100%;background:#39FF14;color:#000;border:none;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;padding:14px;border-radius:4px;cursor:pointer;margin-bottom:16px}
    .btn:disabled{background:#1a1a1a;color:#333;cursor:not-allowed}
    .output{background:#0e0e0e;border:1px solid #1f1f1f;border-radius:4px;padding:16px;font-size:12px;line-height:1.7;color:#ccc;white-space:pre-wrap;word-break:break-word;margin-bottom:12px;min-height:100px}
    .copy{width:100%;background:#111;border:1px solid #222;color:#39FF14;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:11px;border-radius:4px;cursor:pointer}
    .note{font-size:9px;color:#333;letter-spacing:1px;margin-top:-8px;margin-bottom:16px}
    .empty{color:#2a2a2a;font-size:11px;text-align:center;padding:30px 0}
    textarea.inp{resize:vertical;min-height:60px}
    select.inp{appearance:none;cursor:pointer}
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const {useState} = React;

const PLATFORMS = [
  {id:"vinted",name:"Vinted",commission:0.05,fixed:0.7,color:"#09B1BA"},
  {id:"ebay",name:"eBay",commission:0.13,fixed:0.3,color:"#E53238"},
  {id:"subito",name:"Subito.it",commission:0.08,fixed:0,color:"#FF6B00"},
];

const TEMPLATES = {
  vinted:(m,s,c,p,e)=>`🔥 ${m} – Taglia ${s}\n\n✅ Condizione: ${c}\n💶 Prezzo: €${p}\n\n${e?e+"\n\n":""}Acquistati in outlet Nike ufficiale Italia. Originali 100%.\n\n📦 Spedizione rapida con tracking.\n💬 Aperto a offerte!\n\n#nike #${m.toLowerCase().replace(/\s+/g,"")} #sneakers #outlet`,
  ebay:(m,s,c,p,e)=>`Nike ${m} – Taglia EU ${s} – ${c}\n\nModello: Nike ${m}\nTaglia EU: ${s}\nCondizione: ${c}\n${e?"Note: "+e+"\n":""}\n📦 Spedizione con tracking\n↩️ Reso entro 30 giorni\n\nOriginali, acquistati in outlet Nike Italia.`,
  subito:(m,s,c,p,e)=>`Nike ${m} taglia ${s} – €${p}\n\nCondizioni: ${c}\n${e?e+"\n":""}\nOriginali outlet Nike Italia. Spedisco ovunque. Scrivi per info!`,
};

const CONDITIONS = ["Nuovo","Come nuovo","Ottime condizioni","Buone condizioni"];

function App() {
  const [tab,setTab] = useState("calc");
  const [buy,setBuy] = useState("");
  const [sell,setSell] = useState("");
  const [model,setModel] = useState("");
  const [size,setSize] = useState("");
  const [cond,setCond] = useState("Nuovo");
  const [price,setPrice] = useState("");
  const [extra,setExtra] = useState("");
  const [plat,setPlat] = useState("vinted");
  const [gen,setGen] = useState("");
  const [copied,setCopied] = useState(false);

  const b = parseFloat(buy)||0;
  const s = parseFloat(sell)||0;

  function calc(p){
    const fees = s*p.commission+p.fixed;
    const profit = s-b-fees;
    return {profit:profit.toFixed(2),margin:((profit/b)*100).toFixed(1),fees:fees.toFixed(2)};
  }

  function generate(){
    setGen(TEMPLATES[plat](model,size,cond,price,extra));
    setCopied(false);
  }

  function copy(){
    navigator.clipboard.writeText(gen);
    setCopied(true);
    setTimeout(()=>setCopied(false),2000);
  }

  return React.createElement("div",null,
    React.createElement("div",{className:"header"},
      React.createElement("div",{className:"logo"},"Sneak",React.createElement("span",null,"Flip")),
      React.createElement("div",{className:"tagline"},"Reseller toolkit · Italia")
    ),
    React.createElement("div",{className:"tabs"},
      React.createElement("button",{className:"tab "+(tab==="calc"?"active":""),onClick:()=>setTab("calc")},"📊 Margine"),
      React.createElement("button",{className:"tab "+(tab==="listing"?"active":""),onClick:()=>setTab("listing")},"📝 Annuncio")
    ),
    React.createElement("div",{className:"body"},
      tab==="calc" ? React.createElement("div",null,
        React.createElement("div",{className:"sec",style:{marginTop:8}},"Prezzi"),
        React.createElement("div",{className:"row"},
          React.createElement("div",null,
            React.createElement("label",{className:"label"},"Acquisto (€)"),
            React.createElement("input",{className:"inp",type:"number",placeholder:"65",value:buy,onChange:e=>setBuy(e.target.value)})
          ),
          React.createElement("div",null,
            React.createElement("label",{className:"label"},"Vendita (€)"),
            React.createElement("input",{className:"inp",type:"number",placeholder:"120",value:sell,onChange:e=>setSell(e.target.value)})
          )
        ),
        React.createElement("div",{className:"note"},"* Commissioni incluse nel calcolo"),
        React.createElement("div",{className:"sec"},"Profitto per piattaforma"),
        PLATFORMS.map(p=>{
          const {profit,margin,fees}=calc(p);
          const n=parseFloat(profit);
          const cls=n>0?"pos":n<0?"neg":"zero";
          const has=b>0&&s>0;
          return React.createElement("div",{className:"card",key:p.id},
            React.createElement("div",{className:"dot",style:{background:p.color}}),
            React.createElement("div",null,
              React.createElement("div",{className:"pname"},p.name),
              has&&React.createElement("div",{className:"note",style:{marginBottom:0,marginTop:4}},"Fees: €"+fees)
            ),
            React.createElement("div",{className:"profit"},
              has ? React.createElement("div",null,
                React.createElement("div",{className:"pnum "+cls},(n>0?"+":"")+"€"+profit),
                React.createElement("div",{className:"psub"},margin+"% margine")
              ) : React.createElement("div",{className:"psub"},"—")
            )
          );
        })
      ) : React.createElement("div",null,
        React.createElement("div",{className:"sec",style:{marginTop:8}},"Prodotto"),
        React.createElement("label",{className:"label"},"Modello Nike"),
        React.createElement("input",{className:"inp",placeholder:"es. Air Max 90, Shox TL",value:model,onChange:e=>setModel(e.target.value)}),
        React.createElement("div",{className:"row"},
          React.createElement("div",null,
            React.createElement("label",{className:"label"},"Taglia EU"),
            React.createElement("input",{className:"inp",placeholder:"42",value:size,onChange:e=>setSize(e.target.value)})
          ),
          React.createElement("div",null,
            React.createElement("label",{className:"label"},"Prezzo (€)"),
            React.createElement("input",{className:"inp",placeholder:"110",value:price,onChange:e=>setPrice(e.target.value)})
          )
        ),
        React.createElement("label",{className:"label"},"Condizioni"),
        React.createElement("select",{className:"inp",value:cond,onChange:e=>setCond(e.target.value)},
          CONDITIONS.map(c=>React.createElement("option",{key:c},c))
        ),
        React.createElement("label",{className:"label"},"Note extra (opzionale)"),
        React.createElement("textarea",{className:"inp",placeholder:"es. Scatola inclusa...",value:extra,onChange:e=>setExtra(e.target.value)}),
        React.createElement("div",{className:"sec"},"Piattaforma"),
        React.createElement("div",{className:"ptabs"},
          PLATFORMS.map(p=>React.createElement("button",{key:p.id,className:"ptab "+(plat===p.id?"active":""),onClick:()=>{setPlat(p.id);setGen("");}},p.name))
        ),
        React.createElement("button",{className:"btn",onClick:generate,disabled:!model||!size||!price},"Genera annuncio"),
        React.createElement("div",{className:"sec"},"Output"),
        React.createElement("div",{className:"output"},gen||React.createElement("div",{className:"empty"},"L'annuncio apparirà qui →")),
        gen&&React.createElement("button",{className:"copy",onClick:copy},copied?"✓ Copiato!":"Copia testo")
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
